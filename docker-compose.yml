version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: family_calendar
      POSTGRES_USER: calendar_user
      POSTGRES_PASSWORD: calendar_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar_user -d family_calendar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8042:8042"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: calendar_user
      POSTGRES_PASSWORD: calendar_pass
      POSTGRES_DB: family_calendar
      POSTGRES_PORT: 5432
    volumes:
      - ./backend:/app
    command: >
      bash -c "cd /app &&
              python -m alembic upgrade head &&
              uvicorn app.main:app --host 0.0.0.0 --port 8042 --reload"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
