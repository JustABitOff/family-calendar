[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "family-calendar"
version = "0.1.0"
description = "Family Calendar API with iCal integration"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Family Calendar Team"}
]
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "sqlalchemy==2.0.23",
    "alembic==1.12.1",
    "psycopg2-binary==2.9.9",
    "pydantic==2.5.0",
    "python-multipart==0.0.6",
    "icalendar==5.0.11",
    "requests==2.31.0",
    "python-dateutil==2.8.2",
    "apscheduler==3.10.4",
    "python-dotenv==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.hatch.build.targets.wheel]
packages = ["app"]
